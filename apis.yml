description: Axera Intelligence (爱芯元智), operating as Axera Tech, is a Chinese fabless
  semiconductor company building AI-inference SoCs for edge and endpoint computing.
  Its chips pair the Axera Tongyuan mixed-precision NPU with the Axera Zhimu AI-ISP
  to power on-device vision perception, smart-vehicle autonomous-driving and intelligent-cabin
  platforms, and multi-tier edge-AI inference across IoT and industrial scenarios.
  Axera Tech was surfaced as a portfolio company of Qiming Venture Partners; it is
  a hardware/silicon provider and does not currently publish a public developer API,
  SDK, or developer portal.
